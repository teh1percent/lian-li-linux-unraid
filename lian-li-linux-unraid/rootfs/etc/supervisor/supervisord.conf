[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- hardware ---------------------------------------------------------------

[program:sync-devices]
command=/usr/local/bin/sync-devices.sh
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Same invocation as upstream's lianli-daemon-system.service.
[program:lianli-daemon]
command=/usr/bin/lianli-daemon --system --log-level %(ENV_LOG_LEVEL)s
user=lianli
environment=HOME="/var/lib/lianli"
directory=/var/lib/lianli
priority=20
autorestart=true
startsecs=3
startretries=1000
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- browser desktop --------------------------------------------------------

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -nolisten tcp -dpi 96
priority=30
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
user=lianli
environment=HOME="/home/lianli",DISPLAY=":0"
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc]
command=/bin/sh -c 'exec /usr/bin/x11vnc -display :0 -forever -shared -localhost -rfbport 5900 -xrandr resize -quiet $X11VNC_AUTH'
priority=50
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=60
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:lianli-gui]
command=/usr/local/bin/run-gui.sh
user=lianli
priority=70
autorestart=true
startsecs=2
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
