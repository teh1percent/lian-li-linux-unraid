<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lian Li Dashboard</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f5f8; --card: #ffffff; --text: #171b22; --muted: #5d6673; --line: #dfe3ea;
  --accent: #2563c9; --accent-text: #ffffff; --good: #12804a; --warn: #a86400; --bad: #c62828; --bad-bg: #fdecec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a; --card: #1b2028; --text: #eceff4; --muted: #9aa4b2; --line: #2d343f;
    --accent: #5b9bf5; --accent-text: #0d1117; --good: #4cc98a; --warn: #eaa84a; --bad: #ff7b7b; --bad-bg: #3a1c1f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
h1 { font-size: 18px; margin: 0; flex: 1; }
h2 { font-size: 15px; margin: 0 0 10px; }
a { color: var(--accent); }
main { max-width: 860px; margin: 0 auto; padding: 0 16px 96px; }
nav { position: fixed; inset: auto 0 0 0; display: flex; background: var(--card); border-top: 1px solid var(--line); z-index: 2; }
nav button { flex: 1; padding: 13px 2px; min-height: 48px; background: none; border: 0; border-radius: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--accent); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stat b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat span, .muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row > :first-child { min-width: 0; overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.banner { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 600; }
.notice { border-left: 3px solid var(--warn); }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 0; }
label.check { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text); min-height: 32px; }
input, select, button { font: inherit; color: var(--text); }
select, input[type=number], input[type=time], input[type=text] { width: 100%; min-height: 42px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
input[type=range] { width: 100%; height: 32px; accent-color: var(--accent); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
input[type=color] { width: 100%; height: 42px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; }
button.btn { min-height: 42px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.days { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.days label { margin: 4px 0; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; }
.gallery img { width: 100%; aspect-ratio: 1; display: block; border-radius: 50%; background: #000; border: 1px solid var(--line); }
.gallery figcaption { font-size: 13px; text-align: center; margin-top: 4px; color: var(--muted); }
#toast { position: fixed; left: 16px; right: 16px; bottom: 64px; max-width: 480px; margin: 0 auto; padding: 10px 14px; border-radius: 8px; background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 3; }
#toast.show { opacity: 1; }
@media (min-width: 720px) { nav { position: static; max-width: 828px; margin: 0 auto 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; } main { padding-bottom: 40px; } #toast { bottom: 20px; } }
</style>
</head>
<body>
<header>
  <h1>Lian Li</h1>
  <a id="fullApp" target="_blank" rel="noopener">Full app</a>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<script>
'use strict';
const TABS = [['overview', 'Status'], ['fans', 'Fans'], ['lights', 'Lights'], ['screens', 'Screens'], ['auto', 'Automation']];
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const ALERT_TEXT = { disk: 'Disk problem', parity: 'Parity errors', temp: 'Drive too hot' };
const EFFECT_NAMES = (mode) => mode.replace(/([a-z])([A-Z])/g, '$1 $2');
const COLOR_FREE = new Set(['Off', 'Rainbow', 'RainbowMorph']);
const MIN_FAN = 20;

let tab = 'overview';
let data = null;
let drafts = null;
let scheduleDirty = false;

const view = document.getElementById('view');
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hex = (rgb) => '#' + (rgb || [255, 255, 255]).map((part) => part.toString(16).padStart(2, '0')).join('');
const rgbOf = (value) => [1, 3, 5].map((start) => parseInt(value.slice(start, start + 2), 16));
const fileName = (file) => file.split('/').pop();

function toast(message) {
  const element = document.getElementById('toast');
  element.textContent = message;
  element.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => element.classList.remove('show'), 3500);
}

async function post(url, body) {
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Lianli-Dashboard': '1' },
    body: JSON.stringify(body),
  });
  if (!response.ok) {
    const failure = await response.json().catch(() => ({}));
    throw new Error(failure.error || `Request failed (${response.status})`);
  }
}

async function act(url, body, done = 'Saved') {
  try {
    await post(url, body);
    toast(done);
  } catch (error) {
    toast(error.message);
  }
  await refresh(true);
}

function tempClass(temp) {
  if (temp >= 50) return 'bad';
  return temp >= 40 ? 'warn' : 'good';
}

function renderOverview() {
  const { stats, status, daemon, devices } = data;
  const values = stats.values;
  let html = '';
  if (!daemon.connected) html += `<div class="banner">Daemon not reachable. ${esc(daemon.error)}</div>`;
  if (status.alert) {
    html += `<div class="banner"><span>${esc(ALERT_TEXT[status.alert])}</span><button class="btn" data-mute="24">Mute 24 hours</button></div>`;
  } else if (status.muted) {
    html += `<div class="card notice row"><span>Alerts are muted.</span><button class="btn" data-mute="0">Unmute</button></div>`;
  }
  if (status.error) html += `<div class="card notice">Automation problem: ${esc(status.error)}</div>`;
  if (!stats.available) {
    html += `<div class="card notice">Unraid data isn't available. Add the <b>Unraid state</b> path to the container (host <code>/var/local/emhttp</code>).<br><span class="muted">${esc(stats.error)}</span></div>`;
  } else {
    const hottest = stats.hasTemps ? `<b class="${tempClass(values.disk_temp_max)}">${values.disk_temp_max}°C</b>` : '<b>Asleep</b>';
    const sync = values.sync_pct > 0 ? `${values.sync_pct}%` : 'Idle';
    html += `<div class="grid">
      <div class="stat">${hottest}<span>Hottest drive</span></div>
      <div class="stat"><b>${values.disks_active}/${values.disks_total}</b><span>Drives awake</span></div>
      <div class="stat"><b>${values.storage_used_pct}%</b><span>Storage used</span></div>
      <div class="stat"><b>${values.storage_free_tb}</b><span>TB free</span></div>
      ${stats.hasArray ? `<div class="stat"><b class="${values.parity_errors ? 'bad' : ''}">${values.parity_errors}</b><span>Parity errors</span></div>
      <div class="stat"><b>${sync}</b><span>Parity check</span></div>` : ''}
    </div>`;
    if (stats.volumes.length) {
      html += `<div class="card"><h2>Storage</h2>${stats.volumes.map((volume) => `<div class="row"><span>${esc(volume.name)}</span><span class="num">${volume.usedPct}% used, ${volume.freeTb} of ${volume.sizeTb} TB free</span></div>`).join('')}</div>`;
    }
  }
  const fans = devices.filter((device) => device.hasFan);
  html += `<div class="card"><h2>Fans</h2>${fans.length ? fans.map((device) => {
    const rpm = device.rpms.filter((value) => value > 0);
    return `<div class="row"><span>${esc(device.name)}</span><span class="num">${device.unbound ? 'Not bound' : rpm.length ? rpm.join(' / ') + ' RPM' : '0 RPM'}</span></div>`;
  }).join('') : '<span class="muted">No fan groups found.</span>'}</div>`;
  if (stats.disks.length) {
    html += `<div class="card"><h2>Drives</h2>${stats.disks.map((disk) => `<div class="row"><span>${esc(disk.name)}${disk.bad ? ' <span class="bad">problem</span>' : ''}${disk.errors ? ` <span class="bad">${disk.errors} errors</span>` : ''}</span><span class="num ${disk.temp ? tempClass(disk.temp) : 'muted'}">${disk.temp ? disk.temp + '°C' : 'Asleep'}</span></div>`).join('')}</div>`;
  }
  html += `<p class="muted">Server time ${esc(data.localTime)} (${esc(data.timezone)}). Daemon ${esc(daemon.version || 'offline')}.</p>`;
  view.innerHTML = html;
}

function renderFans() {
  const fans = data.devices.filter((device) => device.hasFan && !device.unbound);
  view.innerHTML = fans.length ? fans.map((device) => {
    const isCurve = typeof device.speed === 'string';
    const known = !isCurve || data.curves.includes(device.speed);
    const percent = typeof device.speed === 'number' ? Math.max(MIN_FAN, Math.round(device.speed / 2.55)) : 60;
    const options = [`<option value="constant" ${isCurve ? '' : 'selected'}>Fixed speed</option>`]
      .concat(data.curves.map((curve) => `<option value="curve:${esc(curve)}" ${device.speed === curve ? 'selected' : ''}>Curve: ${esc(curve)}</option>`));
    if (!known) options.push(`<option selected disabled>Set in the full app</option>`);
    const rpm = device.rpms.filter((value) => value > 0);
    return `<div class="card" data-device="${esc(device.id)}">
      <div class="row"><b>${esc(device.name)}</b><span class="num">${rpm.length ? rpm.join(' / ') + ' RPM' : '0 RPM'}</span></div>
      <label>Mode<select data-fan-mode>${options.join('')}</select></label>
      ${isCurve ? '' : `<label>Speed: <span data-out>${percent}%</span><input type="range" min="${MIN_FAN}" max="100" step="5" value="${percent}" data-fan-speed></label>`}
    </div>`;
  }).join('') + `<p class="muted">Fixed speed stops at ${MIN_FAN}% here so fans can't be stopped by accident. Make curves in the full app.</p>`
    : '<div class="card muted">No bound fan groups found.</div>';
}

function renderLights() {
  const lights = data.devices.filter((device) => device.hasRgb && !device.unbound);
  view.innerHTML = lights.length ? lights.map((device) => {
    const effect = device.effect || { mode: device.rgbModes[0] || 'Off', colors: [[255, 255, 255]], brightness: 4 };
    const modes = device.rgbModes.includes(effect.mode) ? device.rgbModes : [effect.mode, ...device.rgbModes];
    return `<div class="card" data-device="${esc(device.id)}">
      <b>${esc(device.name)}</b>
      <label>Effect<select data-rgb-mode>${modes.map((mode) => `<option value="${esc(mode)}" ${mode === effect.mode ? 'selected' : ''}>${esc(EFFECT_NAMES(mode))}</option>`).join('')}</select></label>
      <div class="two">
        <label>Colour<input type="color" data-rgb-color value="${hex(effect.colors?.[0])}" ${COLOR_FREE.has(effect.mode) ? 'disabled' : ''}></label>
        <label>Brightness<select data-rgb-brightness>${[0, 1, 2, 3, 4].map((level) => `<option value="${level}" ${level === effect.brightness ? 'selected' : ''}>${(level + 1) * 20}%</option>`).join('')}</select></label>
      </div>
      <div class="actions"><button class="btn" data-rgb-all>Use on all fans</button></div>
    </div>`;
  }).join('') : '<div class="card muted">No bound lighting found.</div>';
}

function screenValue(device) {
  const screen = data.settings.screens[device.id];
  if (!screen) return 'keep';
  return screen.kind === 'template' ? `template:${screen.templateId}` : `media:${screen.path}`;
}

function renderScreens() {
  const lcds = data.devices.filter((device) => device.hasLcd);
  let html = '';
  if (!lcds.length) {
    html += `<div class="card notice"><b>No screens connected.</b><br>Each LCD fan needs its USB cable connected to the server. Screens appear here automatically afterwards.</div>`;
  } else {
    html += `<div class="card"><h2>What each screen shows</h2>${lcds.map((device) => `
      <label>${esc(device.name)}
        <select data-screen="${esc(device.id)}">
          <option value="keep">Set in the full app</option>
          <optgroup label="Unraid">${data.templates.map((item) => `<option value="template:${esc(item.id)}">${esc(item.name)}</option>`).join('')}</optgroup>
          ${data.media.length ? `<optgroup label="Your media">${data.media.map((file) => `<option value="media:${esc(file)}">${esc(fileName(file))}</option>`).join('')}</optgroup>` : ''}
        </select>
      </label>`).join('')}
      <div class="actions"><button class="btn" id="spread">Different stat on each fan</button></div>
    </div>`;
  }
  html += `<div class="card"><h2>Unraid screens</h2><div class="gallery">${data.templates.map((item) => `<figure><img loading="lazy" alt="${esc(item.name)} preview" src="/api/preview?id=${encodeURIComponent(item.id)}"><figcaption>${esc(item.name.replace('Unraid: ', ''))}</figcaption></figure>`).join('')}</div>
    <p class="muted">Previews come from the daemon, so live values can show as blank here.</p></div>`;
  html += `<p class="muted">To use your own images or videos, put them in the <b>LCD media</b> folder.</p>`;
  view.innerHTML = html;
  lcds.forEach((device) => { view.querySelector(`[data-screen="${CSS.escape(device.id)}"]`).value = screenValue(device); });
}

function scheduleCard(item, index) {
  const screens = [`<option value="">Don't change screen</option>`]
    .concat(data.templates.map((template) => `<option value="${esc(template.id)}" ${item.templateId === template.id ? 'selected' : ''}>${esc(template.name)}</option>`));
  return `<div class="card" data-index="${index}">
    <div class="row"><label class="check"><input type="checkbox" data-k="enabled" ${item.enabled ? 'checked' : ''}>On</label><button class="btn" data-remove>Remove</button></div>
    <label>Name<input type="text" maxlength="40" data-k="name" value="${esc(item.name)}"></label>
    <div class="two">
      <label>From<input type="time" data-k="start" value="${esc(item.start)}"></label>
      <label>Until<input type="time" data-k="end" value="${esc(item.end)}"></label>
    </div>
    <label>Screen brightness: <span data-out>${item.brightness}%</span><input type="range" min="0" max="100" step="5" data-k="brightness" value="${item.brightness}"></label>
    <label>Show<select data-k="templateId">${screens.join('')}</select></label>
    <label>Days (none ticked means every day)</label>
    <div class="days">${DAYS.map((day, number) => `<label class="check"><input type="checkbox" data-day="${number}" ${item.days.includes(number) ? 'checked' : ''}>${day}</label>`).join('')}</div>
  </div>`;
}

function renderAuto() {
  const alerts = data.settings.alerts;
  if (!scheduleDirty) drafts = JSON.parse(JSON.stringify(data.settings.schedules));
  view.innerHTML = `<div class="card" id="alerts"><h2>Alerts on the screens</h2>
      <label class="check"><input type="checkbox" id="aOn" ${alerts.enabled ? 'checked' : ''}>Take over all screens when something is wrong</label>
      <label>Drive too hot at (°C)<input type="number" id="aTemp" min="30" max="70" value="${alerts.diskTempC}"></label>
      <label class="check"><input type="checkbox" id="aDisk" ${alerts.diskProblem ? 'checked' : ''}>Disabled disks or read errors</label>
      ${data.stats.hasArray ? `<label class="check"><input type="checkbox" id="aParity" ${alerts.parityErrors ? 'checked' : ''}>Parity errors</label>` : `<input type="checkbox" id="aParity" hidden ${alerts.parityErrors ? 'checked' : ''}>`}
      <div class="actions"><button class="btn primary" id="aSave">Save alerts</button></div>
    </div>
    <h2>Schedules</h2>
    <div id="schedules">${drafts.map(scheduleCard).join('')}</div>
    ${drafts.length ? '' : '<div class="card muted">No schedules yet.</div>'}
    <div class="actions"><button class="btn" id="addNight">Add night mode</button><button class="btn primary" id="sSave">Save schedules</button></div>
    <p class="muted">Times use the server clock (${esc(data.timezone)}). Fans aren't affected, only screens. An alert overrides any schedule.</p>`;
}

const RENDER = { overview: renderOverview, fans: renderFans, lights: renderLights, screens: renderScreens, auto: renderAuto };

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([id, name]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${name}</button>`).join('');
}

function interacting() {
  const active = document.activeElement;
  return (active && view.contains(active) && /^(INPUT|SELECT)$/.test(active.tagName)) || (tab === 'auto' && scheduleDirty);
}

async function refresh(force = false) {
  try {
    const response = await fetch('/api/state');
    if (!response.ok) throw new Error(`Status ${response.status}`);
    data = await response.json();
    document.getElementById('fullApp').href = `http://${location.hostname}:${data.fullAppPort}/vnc.html?autoconnect=1&resize=remote`;
    // Screens reloads preview images, so it only redraws when asked to.
    if (force || (!interacting() && tab !== 'screens' && tab !== 'auto')) RENDER[tab]();
  } catch (error) {
    if (!data) view.innerHTML = `<div class="banner">Can't reach the dashboard server. ${esc(error.message)}</div>`;
  }
}

function deviceOf(element) {
  return element.closest('[data-device]').dataset.device;
}

function rgbBody(card) {
  return {
    device_id: card.dataset.device,
    mode: card.querySelector('[data-rgb-mode]').value,
    color: rgbOf(card.querySelector('[data-rgb-color]').value),
    brightness: Number(card.querySelector('[data-rgb-brightness]').value),
  };
}

function readDrafts() {
  document.querySelectorAll('#schedules [data-index]').forEach((card) => {
    const item = drafts[Number(card.dataset.index)];
    card.querySelectorAll('[data-k]').forEach((input) => {
      const key = input.dataset.k;
      if (key === 'enabled') item.enabled = input.checked;
      else if (key === 'brightness') item.brightness = Number(input.value);
      else if (key === 'templateId') item.templateId = input.value || null;
      else item[key] = input.value;
    });
    item.days = [...card.querySelectorAll('[data-day]:checked')].map((input) => Number(input.dataset.day));
  });
}

document.getElementById('tabs').addEventListener('click', (event) => {
  const id = event.target.dataset.tab;
  if (!id) return;
  tab = id;
  renderTabs();
  if (data) RENDER[tab]();
});

view.addEventListener('input', (event) => {
  const target = event.target;
  if (target.matches('[data-fan-speed], [data-k="brightness"]')) {
    const value = `${target.value}%`;
    target.closest('label').querySelector('[data-out]').textContent = value;
  }
  if (target.closest('#schedules')) scheduleDirty = true;
});

view.addEventListener('change', (event) => {
  const target = event.target;
  if (target.matches('[data-fan-mode]')) {
    const body = { device_id: deviceOf(target) };
    if (target.value === 'constant') Object.assign(body, { mode: 'constant', percent: 60 });
    else Object.assign(body, { mode: 'curve', curve: target.value.slice(6) });
    act('/api/fan', body);
  } else if (target.matches('[data-fan-speed]')) {
    act('/api/fan', { device_id: deviceOf(target), mode: 'constant', percent: Number(target.value) });
  } else if (target.matches('[data-rgb-mode], [data-rgb-color], [data-rgb-brightness]')) {
    act('/api/rgb', rgbBody(target.closest('[data-device]')));
  } else if (target.matches('[data-screen]')) {
    const [kind, ...rest] = target.value.split(':');
    const value = rest.join(':');
    const screen = kind === 'keep' ? { kind } : kind === 'template' ? { kind, templateId: value } : { kind, path: value };
    act('/api/screen', { device_id: target.dataset.screen, screen });
  }
});

view.addEventListener('click', async (event) => {
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.mute !== undefined) {
    act('/api/alerts/mute', { hours: Number(target.dataset.mute) });
  } else if (target.matches('[data-rgb-all]')) {
    const body = rgbBody(target.closest('[data-device]'));
    const targets = data.devices.filter((device) => device.hasRgb && !device.unbound);
    try {
      for (const device of targets) await post('/api/rgb', { ...body, device_id: device.id });
      toast('Saved');
    } catch (error) {
      toast(error.message);
    }
    refresh(true);
  } else if (target.id === 'spread') {
    const lcds = data.devices.filter((device) => device.hasLcd);
    const order = ['unraid_drives', 'unraid_array', 'unraid_system', 'unraid_overview'];
    try {
      for (const [index, device] of lcds.entries()) {
        await post('/api/screen', { device_id: device.id, screen: { kind: 'template', templateId: order[index % order.length] } });
      }
      toast('Saved');
    } catch (error) {
      toast(error.message);
    }
    refresh(true);
  } else if (target.id === 'aSave') {
    act('/api/alerts', {
      enabled: document.getElementById('aOn').checked,
      diskTempC: Number(document.getElementById('aTemp').value),
      diskProblem: document.getElementById('aDisk').checked,
      parityErrors: document.getElementById('aParity').checked,
    });
  } else if (target.id === 'addNight') {
    readDrafts();
    drafts.push({ name: 'Night mode', start: '23:00', end: '07:00', days: [], brightness: 0, templateId: null, enabled: true });
    scheduleDirty = true;
    RENDER.auto();
  } else if (target.matches('[data-remove]')) {
    readDrafts();
    drafts.splice(Number(target.closest('[data-index]').dataset.index), 1);
    scheduleDirty = true;
    RENDER.auto();
  } else if (target.id === 'sSave') {
    readDrafts();
    try {
      await post('/api/schedules', { schedules: drafts });
      scheduleDirty = false;
      toast('Saved');
    } catch (error) {
      toast(error.message);
    }
    refresh(true);
  }
});

renderTabs();
refresh(true);
setInterval(refresh, 4000);
</script>
</body>
</html>
