[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --- hardware ---------------------------------------------------------------

[program:sync-devices]
command=/usr/local/bin/sync-devices.sh
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Same invocation as upstream's lianli-daemon-system.service, except that the
; desktop display retries are hidden: a container has no logind session, so they
; would warn every 30 seconds for nothing.
[program:lianli-daemon]
command=/usr/bin/lianli-daemon --system --log-level "%(ENV_LOG_LEVEL)s,lianli_daemon::desktop_display=error"
user=lianli
environment=HOME="/var/lib/lianli"
directory=/var/lib/lianli
priority=20
autorestart=true
startsecs=3
startretries=1000
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/run/lianli-logs/daemon.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

; The log above feeds the dashboard's diagnostics report. This copies it to the
; container's own log, so it still shows in Unraid's Logs window.
[program:daemon-log]
command=/usr/bin/tail -n0 -F /run/lianli-logs/daemon.log
priority=21
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/null

; Web dashboard, Unraid stats and LCD automation.
[program:lianli-extras]
command=/usr/bin/node /opt/lianli-extras/server.js
user=lianli
environment=HOME="/var/lib/lianli"
directory=/opt/lianli-extras
priority=25
autorestart=true
startsecs=2
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
